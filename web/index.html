<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101418" />
<title>尘客 · 一群人去哪玩</title>
<style>
  :root {
    --bg: #0f1317;
    --card: #171d23;
    --card-2: #1e262e;
    --line: #2a343d;
    --ink: #e8eef4;
    --ink-dim: #93a3b1;
    --brand: #4dd4ac;
    --brand-ink: #06231b;
    --warn: #ffb454;
    --danger: #ff6b6b;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1b2a32 0%, var(--bg) 55%);
    color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--brand), #3a8fdd);
    display: grid; place-items: center; color: #06231b; font-weight: 800; font-size: 17px;
  }
  h1 { font-size: 21px; margin: 0; letter-spacing: .5px; }
  .slogan { color: var(--ink-dim); font-size: 13px; margin: 2px 0 22px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: .3px; }
  .card h2 .hint { color: var(--ink-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 6px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; background: var(--card-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    font: inherit; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--ink);
    padding: 12px 16px; transition: transform .06s ease, filter .15s ease;
  }
  button:active { transform: scale(.985); }
  button.primary { background: linear-gradient(135deg, var(--brand), #37b98f); color: var(--brand-ink); border: none; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .full { width: 100%; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .muted { color: var(--ink-dim); font-size: 13px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* 滑杆 */
  .slider { margin-bottom: 18px; }
  .slider .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
  .slider .top b { color: var(--brand); font-weight: 600; }
  input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none; height: 26px; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 99px;
    background: linear-gradient(90deg, #3a8fdd, var(--brand));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); margin-top: -8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 99px; background: #2c3a44; }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--brand); }
  .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); }

  /* 开关 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--card-2); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; user-select: none;
  }
  .chip[aria-pressed=true] { background: rgba(77,212,172,.14); border-color: var(--brand); color: var(--brand); }

  /* 方案卡 */
  .plan { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: var(--card-2); }
  .plan.top { border-color: rgba(77,212,172,.55); box-shadow: 0 0 0 1px rgba(77,212,172,.12) inset; }
  .plan .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .plan .title { font-weight: 700; font-size: 15px; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; background: rgba(77,212,172,.16); color: var(--brand); white-space: nowrap; }
  .badge.warn { background: rgba(255,180,84,.15); color: var(--warn); }
  .timeline { margin: 12px 0 6px; padding: 0; list-style: none; }
  .timeline li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); }
  .timeline li:first-child { border-top: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin-top: 8px; flex: none; }
  .timeline .what { flex: 1; }
  .timeline .where { color: var(--ink-dim); font-size: 12px; }
  .timeline .price { color: var(--ink-dim); font-size: 12px; white-space: nowrap; }
  .explain { font-size: 12.5px; color: var(--ink-dim); background: rgba(255,255,255,.03); border-radius: 10px; padding: 10px; margin-top: 6px; }
  .members { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .m { font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.05); color: var(--ink-dim); }
  .m.low { color: var(--warn); background: rgba(255,180,84,.12); }
  .vote-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .vote-row .count { font-size: 13px; color: var(--ink-dim); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-dim); font-weight: 500; font-size: 11.5px; }
  .ok { color: var(--brand); }
  .nope { color: var(--danger); }
  .foot { text-align: center; color: var(--ink-dim); font-size: 11.5px; margin-top: 24px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11.5px; color: var(--brand); background: rgba(77,212,172,.1); padding: 2px 8px; border-radius: 6px; }
  .steps { display: flex; gap: 6px; margin-bottom: 16px; }
  .steps div { flex: 1; height: 3px; border-radius: 99px; background: var(--line); }
  .steps div.on { background: var(--brand); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #222c35; border: 1px solid var(--line); color: var(--ink);
    padding: 10px 18px; border-radius: 99px; font-size: 13px; opacity: 0;
    transition: all .25s ease; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="logo">尘</div>
    <div>
      <h1>尘客</h1>
      <div class="slogan">同是尘客 · 一群人，一个目的地</div>
    </div>
  </header>
  <div id="app"></div>
  <div class="foot">深圳 · 单人参赛作品 · 数据来自高德 POI + 人工标注</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------------- 基础设施 ---------------- */

const $app = document.getElementById("app");

// 用 127.0.0.1 / localhost 访问时，复制出去的链接指向「对方自己的电脑」，
// 必然打不开。这种情况必须在界面上直说，别让用户以为是软件坏了。
// 局域网 IP（10.x / 192.168.x）别人在同一网络下能打开，不需要警告。
const LOCAL_HOST = /^(127\.|localhost$|0\.0\.0\.0$)/.test(location.hostname);

const state = {
  code: localStorage.getItem("zk_code") || "",
  memberId: Number(localStorage.getItem("zk_member") || 0) || null,
  group: null,
  pref: null,
  result: null,
  votes: [],
};

// 回首页。老写法是 `location.hash = ''`，但 hash 本来就是空的时候浏览器不会
// 触发 hashchange，页面就卡在原地。这里直接改写 URL 再手动走一次路由，
// 两种情况都能回得去。
function goHome() {
  history.pushState(null, "", location.pathname + location.search);
  route();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 1900);
}

async function api(path, options = {}) {
  const resp = await fetch("/api" + path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch (e) { /* 忽略 */ }
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return resp.status === 204 ? null : resp.json();
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

const money = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + "k" : Math.round(v));

// 方案时间线默认从下午 2 点开始算
const START_HOUR = 14;
const fmtClock = (offsetMin) => {
  const total = START_HOUR * 60 + Math.round(offsetMin || 0);
  const h = Math.floor(total / 60) % 24;
  const m = total % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
};

/* ---------------- 首屏：建局 / 入局 ---------------- */

async function renderHome() {
  let areas = ["海岸城"];
  try { areas = await api("/areas"); } catch (e) { /* 离线时用默认值 */ }

  // 首页不再「自动跳回上次那个局」（那样会让人出不来），改成给一个显式的入口。
  const lastCode = localStorage.getItem("zk_code") || "";
  const lastName = localStorage.getItem("zk_name") || "";

  $app.innerHTML = `
    ${lastCode ? `<div class="card" style="padding:12px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div><b>上次的局</b>
          <span class="hint" style="margin-left:8px">${esc(lastName || lastCode)} · ${esc(lastCode)}</span></div>
        <button class="ghost" id="btn-resume" style="flex:0 0 auto">继续</button>
      </div>
    </div>` : ""}

    <div class="card">
      <h2>开一个新局<span class="hint">30 秒，然后把链接甩到群里</span></h2>
      <label class="field"><span>这个局叫什么</span>
        <input id="g-name" type="text" placeholder="例如：周六下午，五个人" value="周六去哪" /></label>
      <div class="split">
        <label class="field"><span>从哪出发</span>
          <select id="g-origin">${areas.map((a) => `<option>${esc(a)}</option>`).join("")}</select></label>
        <label class="field"><span>天气</span>
          <select id="g-weather">
            <option value="">晴天</option>
            <option value="rain">下雨 / 台风</option>
            <option value="hot">高温暴晒</option>
          </select></label>
      </div>
      <div class="split">
        <label class="field"><span>人均预算（可留空）</span>
          <input id="g-budget" type="number" min="0" placeholder="120" /></label>
        <label class="field"><span>打算玩多久</span>
          <select id="g-window">
            <option value="240">4 小时</option>
            <option value="360" selected>6 小时</option>
            <option value="480">8 小时</option>
          </select></label>
      </div>
      <button class="primary full" id="btn-create">创建并拿到邀请码</button>
      <button class="ghost full" id="btn-demo" style="margin-top:10px">先看一个示例局（五个人，已填好）</button>
      <div class="err" id="home-err"></div>
    </div>

    <div class="card">
      <h2>已经有邀请码<span class="hint">朋友发你的 6 位码</span></h2>
      <div class="split">
        <label class="field"><span>邀请码</span>
          <input id="j-code" type="text" maxlength="6" placeholder="ABC123" style="text-transform:uppercase" /></label>
        <label class="field"><span>你的昵称</span>
          <input id="j-nick" type="text" placeholder="小王" /></label>
      </div>
      <button class="full" id="btn-join">加入这个局</button>
    </div>`;

  const resume = document.getElementById("btn-resume");
  if (resume) resume.onclick = () => { location.hash = "#g/" + lastCode; };

  document.getElementById("btn-create").onclick = async () => {
    const btn = document.getElementById("btn-create");
    const err = document.getElementById("home-err");
    err.textContent = "";
    btn.disabled = true;
    try {
      const budgetRaw = document.getElementById("g-budget").value.trim();
      const group = await api("/groups", {
        method: "POST",
        body: JSON.stringify({
          name: document.getElementById("g-name").value.trim() || "周六去哪",
          origin_area: document.getElementById("g-origin").value,
          weather: document.getElementById("g-weather").value || null,
          budget: budgetRaw ? Number(budgetRaw) : null,
          window_minutes: Number(document.getElementById("g-window").value),
        }),
      });
      toast("局开好了，邀请码 " + group.code);
      renderJoin(group.code);
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  };

  document.getElementById("btn-demo").onclick = async () => {
    const btn = document.getElementById("btn-demo");
    btn.disabled = true;
    btn.textContent = "正在准备示例…";
    try {
      await startDemo();
    } catch (e) {
      toast(e.message);
      btn.disabled = false;
      btn.textContent = "先看一个示例局（五个人，已填好）";
    }
  };

  document.getElementById("btn-join").onclick = async () => {
    const code = document.getElementById("j-code").value.trim().toUpperCase();
    const nick = document.getElementById("j-nick").value.trim();
    if (code.length !== 6) return toast("邀请码是 6 位");
    if (!nick) return toast("先填个昵称");
    try {
      await joinGroup(code, nick);
    } catch (e) {
      toast(e.message);
    }
  };
}

function renderJoin(code) {
  $app.innerHTML = `
    <div class="card">
      <h2>你是这个局里的谁？</h2>
      <div class="muted" style="margin-bottom:12px">邀请码 <b style="color:var(--brand);letter-spacing:2px">${esc(code)}</b> ·
        把这一页的链接发给朋友，他们填完你再点生成</div>
      <label class="field"><span>你的昵称</span>
        <input id="j2-nick" type="text" placeholder="小王" /></label>
      <button class="primary full" id="btn-join2">进入</button>
      <button class="ghost full" style="margin-top:8px" id="btn-skip">我是组织者，先看看</button>
      <button class="ghost full" style="margin-top:8px" id="btn-join-home">← 回首页</button>
    </div>`;
  const go = async () => {
    const nick = document.getElementById("j2-nick").value.trim();
    if (!nick) return toast("先填个昵称");
    try { await joinGroup(code, nick); } catch (e) { toast(e.message); }
  };
  document.getElementById("btn-join2").onclick = go;
  document.getElementById("j2-nick").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  document.getElementById("btn-skip").onclick = () => loadGroup(code);
  document.getElementById("btn-join-home").onclick = goHome;
}

async function joinGroup(code, nickname) {
  const member = await api(`/groups/${code}/members`, {
    method: "POST",
    body: JSON.stringify({ nickname }),
  });
  state.code = code;
  state.memberId = member.id;
  localStorage.setItem("zk_code", code);
  localStorage.setItem("zk_member", String(member.id));
  await loadGroup(code);
}

/* ---------------- 示例局：点一下就看到最终形态 ---------------- */

async function startDemo() {
  const demo = await api("/demo", { method: "POST" });
  state.code = demo.code;
  state.memberId = demo.member_id;
  state.group = null;
  localStorage.setItem("zk_code", demo.code);
  localStorage.setItem("zk_member", String(demo.member_id));
  history.replaceState(null, "", "#g/" + demo.code);

  await loadGroup(demo.code);
  await api(`/groups/${demo.code}/recommend`, { method: "POST" });
  await renderGroupView();
  toast("这是示例局：五个人口味都不一样，看算法怎么调和");
}

/* ---------------- 填偏好 ---------------- */

async function loadGroup(code) {
  state.code = code;
  localStorage.setItem("zk_code", code);
  const group = await api(`/groups/${code}`);
  state.group = group;
  localStorage.setItem("zk_name", group.name || "");

  // localStorage 里的 memberId 可能来自上一个局。它在本局不存在时必须清掉，
  // 否则会拿别人的 id 去保存偏好/投票（后端直接 422，用户只看到一串英文报错）。
  if (state.memberId && !group.members.some((m) => m.id === state.memberId)) {
    state.memberId = null;
    localStorage.removeItem("zk_member");
  }

  if (!state.memberId) return renderGroupView();

  try {
    state.pref = await api(`/members/${state.memberId}/preference`);
  } catch (e) {
    state.pref = null;
  }
  const me = group.members.find((m) => m.id === state.memberId);
  if (me && !me.filled) return renderPref();
  return renderGroupView();
}

function slider(id, label, leftEnd, rightEnd, value) {
  return `
    <div class="slider">
      <div class="top"><span>${label}</span><b id="${id}-val">${Math.round(value * 100)}</b></div>
      <input type="range" id="${id}" min="0" max="100" value="${Math.round(value * 100)}" />
      <div class="ends"><span>${leftEnd}</span><span>${rightEnd}</span></div>
    </div>`;
}

function renderPref() {
  const p = state.pref || { quiet: 0.5, price: 0.5, near: 0.5, exclude_tags: [],
    indoor_pref: 0, with_kids: false, has_car: false, free_text: "", max_price: null };

  $app.innerHTML = `
    <div class="steps"><div class="on"></div><div class="on"></div><div></div></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <h2 style="margin:0">你的口味<span class="hint">别纠结，凭感觉拖</span></h2>
        <button class="ghost" id="btn-pref-home" style="flex:0 0 auto">首页</button>
      </div>
      ${slider("quiet", "氛围", "要热闹", "要安静", p.quiet)}
      ${slider("price", "花钱", "能省则省", "舍得花", p.price)}
      ${slider("near", "距离", "越近越好", "跑远也行", p.near)}

      <label class="field"><span>人均最多花多少（可留空）</span>
        <input id="max-price" type="number" min="0" placeholder="120"
          value="${p.max_price == null ? "" : p.max_price}" /></label>

      <div style="margin:14px 0 8px" class="muted">硬条件</div>
      <div class="chips" id="chips">
        <div class="chip" data-indoor="1" aria-pressed="${p.indoor_pref === 1}">想待室内</div>
        <div class="chip" data-indoor="-1" aria-pressed="${p.indoor_pref === -1}">想出去走走</div>
        <div class="chip" data-k="with_kids" aria-pressed="${!!p.with_kids}">带小孩</div>
        <div class="chip" data-k="has_car" aria-pressed="${!!p.has_car}">我开车</div>
        <div class="chip" data-tag="辣" aria-pressed="${(p.exclude_tags || []).includes("辣")}">不吃辣</div>
        <div class="chip" data-tag="海鲜" aria-pressed="${(p.exclude_tags || []).includes("海鲜")}">不吃海鲜</div>
        <div class="chip" data-tag="火锅" aria-pressed="${(p.exclude_tags || []).includes("火锅")}">不吃火锅</div>
      </div>

      <label class="field" style="margin-top:16px"><span>或者直接说一句话</span>
        <textarea id="free-text" rows="2" placeholder="下雨天别走太远，人均 100 以内">${esc(p.free_text || "")}</textarea></label>
      <div class="tags" id="hints"></div>
      <button class="primary full" style="margin-top:16px" id="btn-save">保存，回到这个局</button>
      <div class="err" id="pref-err"></div>
    </div>`;

  ["quiet", "price", "near"].forEach((k) => {
    const input = document.getElementById(k);
    input.oninput = () => { document.getElementById(k + "-val").textContent = input.value; };
  });

  // 取不到就跳过：一个按钮的 id 写错，不该连累整页的事件绑定
  const prefHome = document.getElementById("btn-pref-home");
  if (prefHome) prefHome.onclick = goHome;

  document.getElementById("chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const on = chip.getAttribute("aria-pressed") !== "true";
    // 「想待室内」和「想出去走走」互斥，点一个就把另一个按掉
    if (chip.dataset.indoor) {
      document.querySelectorAll(".chip[data-indoor]").forEach((c) => {
        c.setAttribute("aria-pressed", c === chip && on ? "true" : "false");
      });
      return;
    }
    chip.setAttribute("aria-pressed", on ? "true" : "false");
  });

  // 打字时实时解析，让用户看到「我们读懂了什么」
  let timer = null;
  const free = document.getElementById("free-text");
  free.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const text = free.value.trim();
      if (!text) { document.getElementById("hints").innerHTML = ""; return; }
      try {
        const parsed = await api("/parse", { method: "POST", body: JSON.stringify({ text }) });
        document.getElementById("hints").innerHTML = (parsed.parsed_hints || [])
          .map((h) => `<span class="tag">${esc(h)}</span>`).join("");
      } catch (e) { /* 解析失败不影响手填 */ }
    }, 260);
  });
  if (free.value.trim()) free.dispatchEvent(new Event("input"));

  document.getElementById("btn-save").onclick = async () => {
    const btn = document.getElementById("btn-save");
    const body = {
      quiet: Number(document.getElementById("quiet").value) / 100,
      price: Number(document.getElementById("price").value) / 100,
      near: Number(document.getElementById("near").value) / 100,
      max_price: document.getElementById("max-price").value ? Number(document.getElementById("max-price").value) : null,
      exclude_tags: [],
      indoor_pref: 0,
      with_kids: false,
      has_car: false,
      free_text: document.getElementById("free-text").value.trim(),
      auto_parse: true,
    };
    document.querySelectorAll(".chip").forEach((chip) => {
      if (chip.getAttribute("aria-pressed") !== "true") return;
      const tag = chip.dataset.tag;
      const indoor = chip.dataset.indoor;
      if (tag) body.exclude_tags.push(tag);
      else if (indoor) body.indoor_pref = Number(indoor);
      else body[chip.dataset.k] = true;
    });

    btn.disabled = true;
    if (!state.memberId) {
      // 兜底：没登记就保存，先引导去填昵称，而不是把 null 拼进 URL
      btn.disabled = false;
      return renderJoin(state.code);
    }
    try {
      const saved = await api(`/members/${state.memberId}/preference`, {
        method: "PUT",
        body: JSON.stringify(body),
      });
      state.pref = saved;
      toast(saved.parsed_hints && saved.parsed_hints.length ? "已记下：" + saved.parsed_hints.join("、") : "偏好已保存");
      await loadGroup(state.code);
    } catch (e) {
      document.getElementById("pref-err").textContent = e.message;
      btn.disabled = false;
    }
  };
}

/* ---------------- 局内：成员 + 生成 + 投票 ---------------- */

async function renderGroupView() {
  const group = state.group || (await api(`/groups/${state.code}`));
  state.group = group;
  const filled = group.members.filter((m) => m.filled).length;

  let votes = [];
  try { votes = await api(`/groups/${group.code}/votes`); } catch (e) { /* 还没生成方案 */ }
  state.votes = votes;
  const voteMap = Object.fromEntries(votes.map((v) => [v.plan_id, v]));

  let result = null;
  try {
    result = await api(`/groups/${group.code}/plans`);
    result.notes = [];
  } catch (e) {
    result = null;
  }

  const planHtml = (result && result.plans || []).map((plan, idx) => {
    const v = voteMap[plan.id] || { votes: 0, voters: [], winner: false };
    const items = plan.items.map((it) => `
      <li><span class="dot"></span>
        <span class="what"><b>${fmtClock(it.offset_minutes)} · ${esc(it.name)}</b>
          <div class="where">${esc(it.category)} · ${esc(it.area)} · ${it.indoor ? "室内" : "室外"} · ${esc(it.blurb)}</div></span>
        <span class="price">¥${money(it.avg_price)}</span></li>`).join("");
    const members = Object.entries(plan.per_member).map(([name, score]) =>
      `<span class="m ${score < 0.45 ? "low" : ""}">${esc(name)} ${(score * 100).toFixed(0)}</span>`).join("");

    return `
      <div class="plan ${idx === 0 ? "top" : ""}">
        <div class="head">
          <span class="title">方案 ${idx + 1}</span>
          <span class="badge ${v.winner ? "" : "warn"}">${v.winner && v.votes > 0 ? "票数最高" : "共识 " + (plan.consensus * 100).toFixed(0) + "%"}</span>
        </div>
        <ul class="timeline">${items}</ul>        <div class="explain">${esc(plan.explanation)}</div>
        <div class="members">${members}</div>
        <div class="vote-row">
          <button class="ghost" data-vote="${plan.id}" ${!state.memberId ? "disabled" : ""}>
            ${v.votes > 0 && v.voters.includes(nickOf(state.memberId)) ? "已投它" : "投这个"}
          </button>
          <span class="count">${v.votes} 票${v.voters.length ? " · " + v.voters.map(esc).join("、") : ""}</span>
        </div>
      </div>`;
  }).join("");

  const topTable = (result && result.top_pois || []).length ? `
    <div class="card">
      <h2>单个地点的排名<span class="hint">共识分 = 0.6×平均 + 0.4×最不满意那位</span></h2>
      <table>
        <thead><tr><th>地点</th><th>共识</th><th>平均</th><th>最低</th><th>Borda</th><th>后悔</th></tr></thead>
        <tbody>${result.top_pois.slice(0, 8).map((p) => `
          <tr><td>${esc(p.id)}</td>
            <td class="ok">${(p.consensus * 100).toFixed(0)}</td>
            <td>${(p.mean * 100).toFixed(0)}</td>
            <td>${(p.worst * 100).toFixed(0)}</td>
            <td>${(p.borda * 100).toFixed(0)}</td>
            <td>${(p.regret * 100).toFixed(0)}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>` : "";

  $app.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <h2 style="margin:0">${esc(group.name)}<span class="hint">邀请码 ${esc(group.code)}</span></h2>
        <button class="ghost" id="btn-home" style="flex:0 0 auto">首页</button>
      </div>
      <div class="muted" style="margin-bottom:10px">
        出发地 ${esc(group.origin_area)} · 玩 ${(group.window_minutes / 60).toFixed(1)} 小时
        ${group.budget ? " · 人均 ≤ ¥" + group.budget : ""}
        ${group.weather ? " · " + ({ rain: "下雨", hot: "高温" }[group.weather] || "") : ""}
      </div>
      <div class="members">${group.members.map((m) =>
        `<span class="m ${m.filled ? "" : "low"}">${esc(m.nickname)}${m.filled ? "" : " · 没填"}</span>`).join("")}</div>
      <div class="muted" style="margin-top:10px">${filled}/${group.members.length} 人已填偏好</div>

      <div class="split" style="margin-top:14px">
        <button class="ghost" id="btn-invite">复制邀请链接</button>
        <button class="primary" id="btn-generate">${filled ? "生成方案" : (state.memberId ? "去填偏好" : "加入并填偏好")}</button>
      </div>
      ${!state.memberId ? `<button class="ghost full" style="margin-top:8px" id="btn-me">我也要填</button>` : ""}
      ${LOCAL_HOST ? `<div class="muted" style="margin-top:10px;line-height:1.5">
        <b style="color:var(--warn,#e0a33e)">注意</b>：你现在用的是本机地址（${esc(location.hostname)}），
        这条链接只有你自己能打开。让朋友先打开同一个网址，再输邀请码
        <b style="color:var(--brand);letter-spacing:2px">${esc(group.code)}</b>。
        <div id="lan-hint" style="margin-top:8px"></div>
      </div>` : ""}
      <div class="err" id="group-err"></div>
    </div>
    ${(result && result.notes || []).map((n) => `<div class="card" style="padding:12px 16px"><div class="muted">${esc(n)}</div></div>`).join("")}
    ${planHtml ? `<div class="card"><h2>三个方案<span class="hint">点投票，等群里都投完</span></h2>${planHtml}</div>` : ""}
    ${topTable}`;

  // 用本机地址访问时，把「该发给朋友的局域网地址」直接算出来给他
  if (LOCAL_HOST) {
    api("/netinfo")
      .then((n) => {
        const box = document.getElementById("lan-hint");
        const ip = (n.lan_ips || [])[0];
        if (!box || !ip) return;
        const port = location.port ? ":" + location.port : "";
        const url = `http://${ip}${port}/${location.hash}`;
        box.innerHTML = `换成这个地址打开，同一 WiFi 的朋友也能用：` +
          `<a href="${esc(url)}" style="color:var(--brand);word-break:break-all">${esc(url)}</a>`;
      })
      .catch(() => {});
  }

  const homeBtn = document.getElementById("btn-home");
  if (homeBtn) homeBtn.onclick = goHome;

  document.getElementById("btn-invite").onclick = async () => {
    const url = location.origin + location.pathname + "#g/" + group.code;
    try {
      await navigator.clipboard.writeText(url);
      toast(LOCAL_HOST ? `已复制，但本机地址别人打不开——把邀请码 ${group.code} 发群里` : "链接已复制，发群里吧");
    } catch (e) {
      prompt("复制这个链接", url);
    }
  };

  const gen = document.getElementById("btn-generate");
  gen.onclick = async () => {
    if (!filled) {
      // 还没在这个局里登记过，先问「你是谁」，别直接把人扔进填表页——
      // 那样点保存会打 /api/members/null/preference，只会得到一串英文 422。
      if (!state.memberId) return renderJoin(group.code);
      return renderPref();
    }
    gen.disabled = true;
    gen.textContent = "算一下…";
    try {
      const out = await api(`/groups/${group.code}/recommend`, { method: "POST" });
      state.result = out;
      toast(out.notes && out.notes[0] ? out.notes[0] : "方案出来了");
      await renderGroupView();
    } catch (e) {
      document.getElementById("group-err").textContent = e.message;
      gen.disabled = false;
      gen.textContent = "生成方案";
    }
  };

  const me = document.getElementById("btn-me");
  if (me) me.onclick = () => renderJoin(group.code);

  document.querySelectorAll("[data-vote]").forEach((btn) => {
    btn.onclick = async () => {
      if (!state.memberId) return toast("先加入这个局才能投票");
      try {
        await api(`/plans/${btn.dataset.vote}/vote`, {
          method: "POST",
          body: JSON.stringify({ member_id: state.memberId }),
        });
        toast("投好了");
        await renderGroupView();
      } catch (e) { toast(e.message); }
    };
  });
}

function nickOf(memberId) {
  const m = (state.group && state.group.members || []).find((x) => x.id === memberId);
  return m ? m.nickname : "";
}

/* ---------------- 路由 ---------------- */

async function route() {
  const hash = location.hash.replace(/^#/, "");
  try {
    if (hash === "demo") {
      await startDemo();
    } else if (hash.startsWith("g/")) {
      await loadGroup(hash.slice(2));
    } else {
      // 这里**不能**再写回 `state.code` 的兜底。
      // 之前「空 hash 就打开上次那个局」的写法，让首页变成永远到不了的地方：
      // 生成方案之后既没有返回按钮，改地址栏也会被再次送回局里。
      await renderHome();
    }
  } catch (e) {
    $app.innerHTML = `<div class="card"><h2>出了点问题</h2>
      <div class="muted">${esc(e.message)}</div>
      <button class="ghost full" id="btn-err-home" style="margin-top:12px">回到首页</button></div>`;
    document.getElementById("btn-err-home").onclick = goHome;
  }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
