<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fdf3d9" />
<title>尘客 · 一群人去哪玩</title>
<style>
  :root {
    --paper: #fdf3d9;
    --card: #fffdf7;
    --ink: #0d0d0d;
    --muted: #4a4740;
    --yellow: #ffd84d;
    --blue: #a8d4ff;
    --pink: #ffb3c8;
    --bw: 3px;   /* 统一描边 */
    --sh: 6px;   /* 统一硬投影 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 网格子项默认 min-width:auto，遇到日期输入这类宽内容会把整页撑宽 */
  .home > *, .pref-grid > *, .plans > *, .split > * { min-width: 0; }
  input, select, textarea { min-width: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: none; margin: 0 auto; padding: 0 clamp(18px, 2.4vw, 56px) 40px; }
  .mono { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* ── 顶栏 ─────────────────────────────────────── */
  .bar { display: flex; align-items: center; gap: 16px; padding: 18px 0 16px; border-bottom: var(--bw) solid var(--ink); }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .logo {
    width: 36px; height: 36px; border: var(--bw) solid var(--ink); background: var(--yellow);
    display: grid; place-items: center; font-weight: 900; font-size: 17px; box-shadow: 3px 3px 0 var(--ink);
  }
  .brand b { font-size: 19px; font-weight: 900; letter-spacing: .06em; }
  .brand .ver {
    font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 9px; font-weight: 700;
    letter-spacing: .1em; border: 2px solid var(--ink); padding: 1px 4px; transform: translateY(-7px);
  }
  .crumbs { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .bar .acts { margin-left: auto; display: flex; gap: 9px; }

  /* ── 按钮 ─────────────────────────────────────── */
  button {
    font: inherit; font-size: 12.5px; font-weight: 800; letter-spacing: .02em;
    padding: 9px 15px; border: var(--bw) solid var(--ink); background: var(--card); color: var(--ink);
    cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .06s, box-shadow .06s, background .12s;
  }
  button:hover:not(:disabled) { background: var(--yellow); }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--yellow); }
  button.ghost { background: transparent; }
  button.ghost:hover:not(:disabled) { background: var(--card); }
  button.full { width: 100%; }

  /* ── 表单 ─────────────────────────────────────── */
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; background: var(--card); color: var(--ink); border: var(--bw) solid var(--ink);
    padding: 10px 12px; font: inherit; font-weight: 600; outline: none;
  }
  input:focus, select:focus, textarea:focus { box-shadow: 3px 3px 0 var(--ink); }
  textarea { resize: vertical; min-height: 64px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; font-weight: 600; }
  .err { color: #b3241c; font-size: 12.5px; font-weight: 700; min-height: 16px; margin-top: 8px; }
  .wline { font-size: 12.5px; font-weight: 700; min-height: 18px; margin: -2px 0 12px; }
  .wline .hint { margin-left: 10px; font-weight: 600; color: var(--muted); }
  details.adv { margin-bottom: 12px; }
  details.adv > summary { cursor: pointer; font-size: 11.5px; font-weight: 700; color: var(--muted); }

  /* ── 卡片 ─────────────────────────────────────── */
  .card { border: var(--bw) solid var(--ink); background: var(--card); box-shadow: var(--sh) var(--sh) 0 var(--ink);
    padding: 16px; margin-bottom: 22px; }
  .card h2 { font-size: 17px; font-weight: 900; letter-spacing: -.01em; margin: 0 0 14px; }
  .card h2 .hint { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

  /* ── 首页 ─────────────────────────────────────── */
  .home-hero { padding: 30px 0 24px; }
  .home-hero h1 { font-size: 46px; line-height: 1.02; font-weight: 900; letter-spacing: -.035em; margin: 0; }
  .home-hero h1 mark { background: var(--yellow); padding: 0 .1em; }
  .home-hero p { margin: 16px 0 0; font-size: 14.5px; font-weight: 600; color: #3c3a33; max-width: 620px; }
  .home { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: start; }
  .steps-card { background: var(--card); }
  .steps-list { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; font-weight: 600; line-height: 2; }
  .steps-list b { font-weight: 900; }
  .steps-list li::marker { font-family: "Cascadia Mono", ui-monospace, monospace; font-weight: 800; }
  .home .stack > .card:last-child { margin-bottom: 0; }

  /* ── 局内 ─────────────────────────────────────── */
  .group-hero { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end; padding: 26px 0 18px; }
  .group-hero h1 { font-size: 40px; line-height: 1.04; font-weight: 900; letter-spacing: -.035em; margin: 0; }
  .group-hero .code { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 11px;
    font-weight: 700; letter-spacing: .12em; color: var(--muted); margin-top: 10px; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(128px, 1fr)); gap: 10px; }
  .members-line { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 2px; }
  .tile { border: var(--bw) solid var(--ink); background: var(--card); padding: 9px 12px; box-shadow: 3px 3px 0 var(--ink); }
  .tile .k { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .tile .v { font-size: 14px; font-weight: 800; margin-top: 3px; white-space: nowrap; }

  .ticker { display: flex; align-items: stretch; border: var(--bw) solid var(--ink); background: var(--ink);
    color: var(--card); margin-bottom: 18px; overflow: hidden; }
  .ticker > span { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700;
    letter-spacing: .04em; padding: 9px 14px; white-space: nowrap; }
  .ticker > span + span { border-left: 1px solid #3a3a34; }
  .ticker b { color: var(--yellow); font-weight: 800; }
  .ticker .mid { margin-left: auto; }

  .acts-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .acts-row .btn-spacer { margin-left: auto; }

  .notes { border-left: 5px solid var(--blue); background: #eef7ff; border-top: var(--bw) solid var(--ink);
    border-right: var(--bw) solid var(--ink); border-bottom: var(--bw) solid var(--ink);
    padding: 9px 12px; font-size: 12px; font-weight: 700; margin-bottom: 18px; }

  /* ── 三个方案 ─────────────────────────────────── */
  .plans-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .plans-head h2 { font-size: 20px; font-weight: 900; letter-spacing: -.02em; margin: 0; }
  .plans-head .n { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 10px;
    font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .plans-head .aside { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--muted); }

  .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .plan { position: relative; border: var(--bw) solid var(--ink); background: var(--card);
    box-shadow: var(--sh) var(--sh) 0 var(--ink); padding: 16px 16px 14px; display: flex; flex-direction: column; }
  .plan.top { border-width: 4px; box-shadow: 8px 8px 0 var(--ink); }
  .plan.top::after { content: "首选"; position: absolute; top: -15px; right: 14px; background: var(--yellow);
    border: 3px solid var(--ink); font-size: 11px; font-weight: 900; letter-spacing: .14em; padding: 2px 8px; }

  .plan .head { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 11px; border-bottom: var(--bw) solid var(--ink); }
  .plan .rank { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 900;
    background: var(--ink); color: var(--card); padding: 3px 7px; letter-spacing: .06em; flex: none; }
  .plan .title { font-size: 17px; font-weight: 900; line-height: 1.25; letter-spacing: -.01em; flex: 1; }
  .badge { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 800;
    border: 2px solid var(--ink); padding: 2px 6px; white-space: nowrap; background: var(--blue); }
  .badge.warn { background: var(--card); }

  .plan .sub { display: flex; align-items: center; gap: 8px; padding: 10px 0 2px; font-size: 11px; font-weight: 700; }
  .plan .sub .len { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 10.5px; color: var(--muted); }
  .plan .sub .score { margin-left: auto; font-family: "Cascadia Mono", ui-monospace, Consolas, monospace;
    font-size: 24px; font-weight: 900; letter-spacing: -.03em; white-space: nowrap; line-height: 1;
    flex: none; padding-right: 2px; }
  .plan .sub .score i { font-style: normal; font-size: 14px; font-weight: 800; letter-spacing: .02em; margin-left: 3px; vertical-align: 2px; }

  .timeline { list-style: none; margin: 6px 0 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 48px 1fr auto; gap: 0 10px; align-items: baseline;
    padding: 10px 0; border-bottom: 2px dashed #c9c1ad; }
  .timeline li:last-child { border-bottom: 0; }
  .timeline .t { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace;
    font-size: 11.5px; font-weight: 800; letter-spacing: -.02em; }
  .timeline .nm { font-size: 13.5px; font-weight: 900; letter-spacing: -.01em; }
  .timeline .where { grid-column: 2 / span 2; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 3px; }
  .timeline .shut { grid-column: 2 / span 2; font-size: 10.5px; font-weight: 800; color: #b3241c; margin-top: 2px; }
  .timeline .price { grid-row: 1; grid-column: 3; text-align: right; font-family: "Cascadia Mono", ui-monospace, Consolas, monospace;
    font-size: 11.5px; font-weight: 800; }

  .explain { margin-top: auto; background: #f6efd8; border-left: 5px solid var(--pink);
    padding: 9px 10px; font-size: 11.5px; line-height: 1.65; font-weight: 600; }
  .members { display: flex; gap: 4px; flex-wrap: wrap; margin: 11px 0 12px; }
  .m { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 800;
    border: 2px solid var(--ink); background: #fff; padding: 2px 5px; letter-spacing: -.02em; }
  .m.low { background: var(--pink); }
  .vote-row { display: flex; flex-direction: column; gap: 6px; }
  .vote-row button { width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: var(--yellow); color: var(--ink); font-size: 12.5px; font-weight: 900; letter-spacing: .08em;
    padding: 10px 14px; box-shadow: 3px 3px 0 var(--ink); }
  .vote-row button:hover:not(:disabled) { background: #ffe27a; }
  .vote-row button.mine { background: var(--card); letter-spacing: .04em; }
  .vote-row .count { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 10.5px; font-weight: 700; color: var(--muted); }

  /* ── 偏好表单 ─────────────────────────────────── */
  .steps { display: flex; gap: 6px; margin-bottom: 18px; }
  .steps div { flex: 1; height: 6px; border: 2px solid var(--ink); background: transparent; }
  .steps div.on { background: var(--yellow); }
  .pref-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; }
  .slider { margin-bottom: 18px; }
  .slider .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 2px; }
  .slider .top span { font-weight: 800; letter-spacing: .04em; }
  .slider .top b { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-size: 15px; font-weight: 900;
    background: var(--ink); color: var(--card); padding: 0 6px; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 26px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: var(--card); border: 2px solid var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--yellow);
    border: 3px solid var(--ink); margin-top: -8px; box-shadow: 2px 2px 0 var(--ink); }
  input[type=range]::-moz-range-track { height: 8px; background: var(--card); border: 2px solid var(--ink); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--yellow); border: 3px solid var(--ink); border-radius: 0; }
  .ends { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2.5px solid var(--ink); background: var(--card); padding: 7px 12px; font-size: 12px;
    font-weight: 800; cursor: pointer; user-select: none; box-shadow: 2px 2px 0 var(--ink); }
  .chip[aria-pressed=true] { background: var(--yellow); }
  .chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 20px; }
  .tag { font-size: 11px; font-weight: 800; background: var(--blue); border: 2px solid var(--ink); padding: 1px 7px; }

  /* ── 表格 ─────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 2px solid #e3dbc6; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    border-bottom: var(--bw) solid var(--ink); }
  td { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; font-weight: 700; }
  td:first-child { font-family: inherit; font-weight: 700; }
  .ok { background: var(--yellow); }

  /* ── 页脚 / 提示 ──────────────────────────────── */
  .foot { display: flex; align-items: center; gap: 16px; margin-top: 26px; padding-top: 14px;
    border-top: var(--bw) solid var(--ink); font-size: 11px; font-weight: 700; }
  .foot .r { margin-left: auto; font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: var(--card); padding: 10px 18px; font-size: 12.5px; font-weight: 700;
    border: var(--bw) solid var(--yellow); opacity: 0; transition: all .22s ease; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 响应式：桌面优先，窄屏退回单列 ───────────── */
  @media (max-width: 1180px) {
    .plans { grid-template-columns: repeat(2, 1fr); }
    .plans .plan:last-child { grid-column: span 2; }
    .group-hero { grid-template-columns: 1fr; gap: 16px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 900px) {
    .shell { padding: 0 18px 26px; }
    .home { grid-template-columns: 1fr; }
    .home-hero h1 { font-size: 32px; }
    .group-hero h1 { font-size: 28px; }
    .plans { grid-template-columns: 1fr; gap: 18px; }
    .plans .plan:last-child { grid-column: auto; }
    .pref-grid { grid-template-columns: 1fr; gap: 8px; }
    .ticker { overflow-x: auto; }
    .split { grid-template-columns: 1fr; gap: 0; }
    .crumbs { display: none; }
  }

  /* ── 打印：评委桌上那份材料 ───────────────────── */
  @media print {
    body { background: #fff; }
    .shell { max-width: none; padding: 0; }
    .toast, .acts-row, .bar .acts, .vote-row button { display: none; }
    .card, .plan, .tile { box-shadow: none; border: 1pt solid #000; }
    .plan { break-inside: avoid; page-break-inside: avoid; }
    .plans { grid-template-columns: 1fr; gap: 12px; }
    .plan.top::after { border: 1pt solid #000; }
    h1, .home-hero h1 { font-size: 24pt; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand">
      <div class="logo">尘</div>
      <b>尘客</b>
      <span class="ver">BETA</span>
    </div>
    <div class="crumbs">Shenzhen · 202 places · 20 areas</div>
    <div class="acts" id="bar-acts"></div>
  </header>

  <div id="app"></div>

  <footer class="foot">
    <span>尘客</span>
    <span class="r" id="foot-r"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------------- 基础设施 ---------------- */

const $app = document.getElementById("app");
const $acts = document.getElementById("bar-acts");
const $footR = document.getElementById("foot-r");

// 用 127.0.0.1 / localhost 访问时，复制出去的链接指向「对方自己的电脑」，
// 必然打不开。这种情况必须在界面上直说，别让用户以为是软件坏了。
// 局域网 IP（10.x / 192.168.x）别人在同一网络下能打开，不需要警告。
const LOCAL_HOST = /^(127\.|localhost$|0\.0\.0\.0$)/.test(location.hostname);

const state = {
  code: localStorage.getItem("zk_code") || "",
  memberId: Number(localStorage.getItem("zk_member") || 0) || null,
  group: null,
  pref: null,
  result: null,
  votes: [],
};

// 回首页。老写法是 `location.hash = ''`，但 hash 本来就是空的时候浏览器不会
// 触发 hashchange，页面就卡在原地。这里直接改写 URL 再手动走一次路由，
// 两种情况都能回得去。
function goHome() {
  history.pushState(null, "", location.pathname + location.search);
  route();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 1900);
}

async function api(path, options = {}) {
  const resp = await fetch("/api" + path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch (e) { /* 忽略 */ }
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return resp.status === 204 ? null : resp.json();
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

const money = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + "k" : Math.round(v));

// 日期选择器用本地时区的「今天」，不能用 toISOString()——那是 UTC，
// 在 UTC+8 的晚上八点之后会算出「昨天」。
function isoDay(offset) {
  const d = new Date();
  d.setDate(d.getDate() + (offset || 0));
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

const WEATHER_LABEL = {
  rain: "雨天，方案会优先室内",
  storm: "台风 / 雷雨，方案会优先室内",
  hot: "高温，方案会优先有空调的地方",
  clear: "天气不错，室内室外都行",
};

const WEATHER_SHORT = { rain: "下雨", storm: "台风", hot: "高温", clear: "晴天" };

// 选完日期就去问那天的天气。查不到也不拦着建局，只是把「手动选」露出来。
async function refreshWeather(dateInput, weatherSelect, out) {
  const day = dateInput.value;
  if (!day) { out.textContent = ""; return; }
  out.textContent = "正在查那天的天气…";
  try {
    const w = await api("/weather?date=" + encodeURIComponent(day));
    if (!w.kind) {
      out.innerHTML = `<span class="hint">${esc(w.message || "这天的预报暂时查不到，可以手动选")}</span>`;
      return;
    }
    const temp = w.high != null && w.low != null
      ? ` ${Math.round(w.high)}°/${Math.round(w.low)}°` : "";
    const rain = w.precip != null ? ` · 降水概率 ${w.precip}%` : "";
    out.innerHTML = `<b>${esc(w.text || "")}${temp}</b>`
      + `<span class="hint">${esc(WEATHER_LABEL[w.kind] || "")}${rain}</span>`;
    // 只改「按预报走」的那种：用户手动选过就别覆盖他
    if (!weatherSelect.value) weatherSelect.value = w.kind === "clear" ? "" : w.kind;
  } catch (e) {
    out.innerHTML = `<span class="hint">天气查不到（${esc(e.message)}），可以手动选</span>`;
  }
}

// 出发时刻由后端按「全组最晚能出发的人」给出（plan.start_minute），默认下午 2 点
const DEFAULT_START_MINUTE = 14 * 60;
const fmtClock = (offsetMin, startMinute) => {
  const total = (startMinute ?? DEFAULT_START_MINUTE) + Math.round(offsetMin || 0);
  const h = Math.floor(total / 60) % 24;
  const m = total % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
};

// 卡片标题由真实品类推出来：餐饮→吃一顿、影院→看一场……
// 比「方案 1」有画面感，而且不会出现数据里没有的景点。
const CAT_VERB = {
  餐饮: "吃一顿", 咖啡: "喝一杯", 影院: "看一场", 展览: "逛个展",
  公园: "走一走", 玩乐: "玩一场", 夜生活: "逛夜市",
};
function planTitle(plan) {
  const words = [];
  for (const it of plan.items || []) {
    const w = CAT_VERB[it.category] || it.category;
    if (!words.includes(w)) words.push(w);
  }
  return words.slice(0, 3).join(" · ") || "这一段路";
}

function planMinutes(plan) {
  if (plan.total_minutes != null) return Math.round(plan.total_minutes);
  const items = plan.items || [];
  if (!items.length) return 0;
  const last = items[items.length - 1];
  return Math.round(last.offset_minutes || 0);
}

function planDuration(plan) {
  const m = planMinutes(plan);
  if (!m) return "";
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return h ? `${h} 小时 ${mm} 分` : `${mm} 分钟`;
}

function planIndoor(plan) {
  const items = plan.items || [];
  if (!items.length) return "";
  const indoors = items.filter((it) => it.indoor).length;
  return indoors === items.length ? "全程室内" : (indoors === 0 ? "全程室外" : "室内外都有");
}

async function loadGroup(code) {
  state.code = code;
  localStorage.setItem("zk_code", code);
  const group = await api(`/groups/${code}`);
  state.group = group;
  localStorage.setItem("zk_name", group.name || "");

  // localStorage 里的 memberId 可能来自上一个局。它在本局不存在时必须清掉，
  // 否则会拿别人的 id 去保存偏好/投票（后端直接 422，用户只看到一串英文报错）。
  if (state.memberId && !group.members.some((m) => m.id === state.memberId)) {
    state.memberId = null;
    localStorage.removeItem("zk_member");
  }

  if (!state.memberId) return renderGroupView();

  try {
    state.pref = await api(`/members/${state.memberId}/preference`);
  } catch (e) {
    state.pref = null;
  }
  const me = group.members.find((m) => m.id === state.memberId);
  if (me && !me.filled) return renderPref();
  return renderGroupView();
}

    const on = chip.getAttribute("aria-pressed") !== "true";

    if (chip.dataset.indoor) {

  try { votes = await api(`/groups/${group.code}/votes`); } catch (e) { /* 还没生成方案 */ }

  const voteMap = Object.fromEntries(votes.map((v) => [v.plan_id, v]));

  try {
    result = await api(`/groups/${group.code}/plans`);
    result.notes = [];
  } catch (e) {
    result = null;

    : "未定";

    .map((m) => `${esc(m.nickname)}${m.filled ? " ✓" : ""}`)

  const planHtml = plans.map((plan, idx) => {
    const v = voteMap[plan.id] || { votes: 0, voters: [], winner: false };

    const items = plan.items.map((it) => `

        <div class="explain">${esc(plan.explanation)}</div>
        <div class="members">${members}</div>
        <div class="vote-row">
          <button class="${mine ? "mine" : ""}" data-vote="${plan.id}" ${!state.memberId ? "disabled" : ""}>
            <span>${mine ? "已投它" : "投这个"}</span>
            <span class="mono" style="opacity:.7">${v.votes} 票</span>
          </button>
          ${v.voters.length ? `<div class="count">${v.voters.map(esc).join("、")}</div>` : ""}
        </div>
      </section>`;
  }).join("");

  const topTable = (result && result.top_pois || []).length ? `
    <div class="card" style="margin-top:26px">
      <h2>单个地点的排名<span class="hint">共识分 = 0.6×平均 + 0.4×最不满意那位</span></h2>
      <table>
        <thead><tr><th>地点</th><th>共识</th><th>平均</th><th>最低</th><th>Borda</th><th>后悔</th></tr></thead>
        <tbody>${result.top_pois.slice(0, 8).map((p) => `
          <tr><td>${esc(p.id)}</td>
            <td class="ok">${(p.consensus * 100).toFixed(0)}</td>
            <td>${(p.mean * 100).toFixed(0)}</td>
            <td>${(p.worst * 100).toFixed(0)}</td>
            <td>${(p.borda * 100).toFixed(0)}</td>
            <td>${(p.regret * 100).toFixed(0)}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>` : "";

  const notesHtml = ((result && result.notes) || [])
    .map((n) => `<div class="notes">${esc(n)}</div>`).join("");

  const CN = ["零", "一", "两", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
  const cn = (n) => CN[n] || String(n);
  const weatherWord = { rain: "下雨", storm: "台风", hot: "高温", clear: "晴天" }[group.weather] || "天气还没定";
  const hours = Math.round(group.window_minutes / 60);
  const headline = plans.length
    ? `${cn(group.members.length)}个人，${cn(hours)}个小时，${weatherWord}。<br>不是 ${cn(plans.length)} 个地点，是 ${cn(plans.length)} 段路。`
    : `${cn(group.members.length)}个人，${cn(hours)}个小时，${weatherWord}。<br>还没有方案，点「生成方案」看看。`;

  $app.innerHTML = `
    <div class="group-hero">
      <div>
        <h1>${headline}</h1>
        <div class="code">${esc(group.name)} · 邀请码 ${esc(group.code)} · ${filled}/${group.members.length} 人已填</div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="k">出发</div><div class="v">${esc(group.origin_area)}</div></div>
        <div class="tile"><div class="k">日期</div><div class="v">${dateLine}</div></div>
        <div class="tile"><div class="k">时长</div><div class="v">${(group.window_minutes / 60).toFixed(0)} 小时</div></div>
        <div class="tile"><div class="k">天气</div><div class="v">${weatherLine}</div></div>
      </div>
    </div>

    <div class="members-line">${group.members.map((m) =>
      `<span class="m${m.filled ? "" : " low"}">${esc(m.nickname)}${m.filled ? " ✓" : " · 没填"}</span>`).join("")}</div>

    <div class="acts-row">
      <button class="primary" id="btn-generate">${filled ? "生成方案" : (state.memberId ? "去填偏好" : "加入并填偏好")}</button>
      <button class="ghost" id="btn-invite">复制邀请链接</button>
      <button class="ghost" id="btn-me">${state.memberId ? "改我的偏好" : "我也要填"}</button>
    </div>

    ${LOCAL_HOST ? `<div class="notes" style="border-left-color:var(--pink)">
      <b>注意</b>：你现在用的是本机地址（${esc(location.hostname)}），这条链接只有你自己能打开。
      让朋友先打开同一个网址，再输邀请码 <b>${esc(group.code)}</b>。
      <div id="lan-hint" style="margin-top:6px;font-weight:600"></div>
    </div>` : ""}

    ${notesHtml}

    <div class="plans-head">
      <span class="n">${plans.length} plans</span>
      <h2>三个方案</h2>
      <span class="aside">横向比完，点「投这个」定案</span>
    </div>

    ${plans.length ? `<div class="plans">${planHtml}</div>`
    : `<div class="card"><h2>还没有方案<span class="hint">等大家都填完，点上面的「生成方案」</span></h2>
        <div class="muted">填好偏好的人越多，共识分越准。现在 ${filled}/${group.members.length}。</div></div>`}

    ${topTable}
    <div class="err" id="group-err"></div>`;

  // 用本机地址访问时，把「该发给朋友的局域网地址」直接算出来给他
  if (LOCAL_HOST) {
    api("/netinfo")
      .then((n) => {
        const box = document.getElementById("lan-hint");
        const ip = (n.lan_ips || [])[0];
        if (!box || !ip) return;
        const port = location.port ? ":" + location.port : "";
        const url = `http://${ip}${port}/${location.hash}`;
        box.innerHTML = `换成这个地址打开，同一 WiFi 的朋友也能用：` +
          `<a href="${esc(url)}" style="color:var(--ink);word-break:break-all">${esc(url)}</a>`;
      })
      .catch(() => {});
  }

  const homeBtn = document.getElementById("btn-home");
  if (homeBtn) homeBtn.onclick = goHome;

  document.getElementById("btn-invite").onclick = async () => {
    const url = location.origin + location.pathname + "#g/" + group.code;
    try {
      await navigator.clipboard.writeText(url);
      toast(LOCAL_HOST ? `已复制，但本机地址别人打不开——把邀请码 ${group.code} 发群里` : "链接已复制，发群里吧");
    } catch (e) {
      prompt("复制这个链接", url);
    }
  };

  const gen = document.getElementById("btn-generate");
  gen.onclick = async () => {
    if (!filled) {
      // 还没在这个局里登记过，先问「你是谁」，别直接把人扔进填表页——
      // 那样点保存会打 /api/members/null/preference，只会得到一串英文 422。
      if (!state.memberId) return renderJoin(group.code);
      return renderPref();
    }
    gen.disabled = true;
    gen.textContent = "算一下…";
    try {
      const out = await api(`/groups/${group.code}/recommend`, { method: "POST" });
      state.result = out;
      toast(out.notes && out.notes[0] ? out.notes[0] : "方案出来了");
      await renderGroupView();
    } catch (e) {
      document.getElementById("group-err").textContent = e.message;
      gen.disabled = false;
      gen.textContent = "生成方案";
    }
  };

  const me = document.getElementById("btn-me");
  if (me) me.onclick = () => renderJoin(group.code);

  document.querySelectorAll("[data-vote]").forEach((btn) => {
    btn.onclick = async () => {
      if (!state.memberId) return toast("先加入这个局才能投票");
      try {
        await api(`/plans/${btn.dataset.vote}/vote`, {
          method: "POST",
          body: JSON.stringify({ member_id: state.memberId }),
        });
        toast("投好了");
        await renderGroupView();
      } catch (e) { toast(e.message); }
    };
  });
}

function nickOf(memberId) {
  const m = (state.group && state.group.members || []).find((x) => x.id === memberId);
  return m ? m.nickname : "";
}

/* ---------------- 路由 ---------------- */

async function route() {
  const hash = location.hash.replace(/^#/, "");
  try {
    if (hash === "demo") {
      await startDemo();
    } else if (hash.startsWith("g/")) {
      await loadGroup(hash.slice(2));
    } else {
      // 这里**不能**再写回 `state.code` 的兜底。
      // 之前「空 hash 就打开上次那个局」的写法，让首页变成永远到不了的地方：
      // 生成方案之后既没有返回按钮，改地址栏也会被再次送回局里。
      await renderHome();
    }
  } catch (e) {
    setChrome("Error", `<button class="ghost" id="bar-home">回首页</button>`, "");
    const bh = document.getElementById("bar-home");
    if (bh) bh.onclick = goHome;
    $app.innerHTML = `<div class="home-hero"><h1>出了点<mark>问题</mark>。</h1>
      <p>${esc(e.message)}</p></div>
      <div style="max-width:560px"><div class="card">
        <button class="primary full" id="btn-err-home">回到首页</button>
      </div></div>`;
    document.getElementById("btn-err-home").onclick = goHome;
  }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
